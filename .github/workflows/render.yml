name: render
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id
        required: true
      payload:
        description: JSON payload
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
      - name: Render
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.job_id }}
          path: work/out/*
          if-no-files-found: error
